{% extends 'habit/layout.html' %} {% block body %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow border-secondary p-4" style="background: rgb(0, 0, 0, 0.7); backdrop-filter: blur(10px);">
        <div class="text-center mb-4">
          <h2 class="fw-bold text-white">Create Account</h2>
          <p class="text-secondary">
            Start tracking habits and earning XP today.
          </p>
        </div>

        <form action="{% url 'register' %}" method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label for="username" class="form-label fw-bold text-white"
              >Username</label
            >
            <input
              autofocus
              type="text"
              id="username"
              name="username"
              class="form-control bg-dark text-white border-secondary"
              placeholder="Choose a username"
              required
            />
          </div>
          <div class="mb-3">
            <label for="email" class="form-label fw-bold text-white"
              >Email Address</label
            >
            <input
              type="email"
              id="email"
              name="email"
              class="form-control bg-dark text-white border-secondary"
              placeholder="name@example.com"
              required
            />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label fw-bold text-white"
              >Password</label
            >
            <input
              type="password"
              id="password"
              name="password"
              class="form-control bg-dark text-white border-secondary"
              placeholder="Create a password"
              required
            />
          </div>
          <div class="mb-4">
            <label for="confirmation" class="form-label fw-bold text-white"
              >Confirm Password</label
            >
            <input
              type="password"
              id="confirmation"
              name="confirmation"
              class="form-control bg-dark text-white border-secondary"
              placeholder="Type password again"
              required
            />
          </div>
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary btn-lg fw-bold shadow">
              Register
            </button>
          </div>
        </form>

        <div class="text-center mt-4">
          <p class="small text-secondary mb-0">
            Already have an account?
            <a
              href="{% url 'login' %}"
              class="text-primary fw-bold text-decoration-none"
              >Log in</a
            >
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock body %}
