{% extends 'habit/layout.html' %} {% block body %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow border-secondary p-4" style="background: rgb(0, 0, 0, 0.7); backdrop-filter: blur(10px);">
        <div class="text-center mb-4">
          <h2 class="fw-bold text-white">Welcome Back</h2>
          <p class="text-secondary">Log in to protect your habit streaks.</p>
        </div>

        <form action="{% url 'login' %}" method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label for="username" class="form-label fw-bold text-white"
              >Username</label
            >
            <input
              autofocus
              type="text"
              id="username"
              name="username"
              class="form-control bg-dark text-white border-secondary"
              placeholder="Enter your username"
              required
            />
          </div>
          <div class="mb-4">
            <label for="password" class="form-label fw-bold text-white"
              >Password</label
            >
            <input
              type="password"
              id="password"
              name="password"
              class="form-control bg-dark text-white border-secondary"
              placeholder="Enter your password"
              required
            />
          </div>
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary btn-lg fw-bold shadow">
              Log In
            </button>
          </div>
        </form>

        <div class="text-center mt-4">
          <p class="small text-secondary mb-0">
            Don't have an account?
            <a
              href="{% url 'register' %}"
              class="text-primary fw-bold text-decoration-none"
              >Register here</a
            >
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock body %}
